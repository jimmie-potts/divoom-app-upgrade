name: Feature
description: Define the smallest useful change for the real setup.
labels: [enhancement, 'status:backlog']
body:
  - type: markdown
    attributes:
      value: >-
        Size the story for one operator, one local backend and the configured
        Pixoo. A small story may answer each prompt in a few sentences. See the
        scope defaults in docs/sdlc.md.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and real setup
      description: State what the user will observe, on which host and device or the simulator, and what is excluded.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Smallest useful implementation
      description: Start from existing components and explicit manual steps. Link prerequisite issues, or state none.
    validations:
      required: true
  - type: textarea
    id: preserve
    attributes:
      label: Behavior and protections to preserve
      description: Name the existing behavior, the single device writer, targets, manual control, credentials, and media and playlist data that must keep working.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and planned evidence
      description: List observable scenarios and the automated check or manual observation for each, including any Windows or device verification. Choose the delivery target, source-only, including installation and its verification, or including explicitly authorized physical-device verification. Installation or physical-device work requires an explicit request and an identified owner.
      value: "Delivery target: source-only"
    validations:
      required: true
  - type: textarea
    id: deferrals
    attributes:
      label: Meaningful deferrals
      description: For each meaningful omission, state its consequence or manual alternative and its owning issue or revisit trigger.
      value: None
    validations:
      required: true
